    <style>
        /* "Botanical Sunday" - warm sage & terracotta editorial styling */
        :root {
            --primary-color: #8a7452;
            /* Warm clay/terracotta */

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .top-nav a {
            color: var(--text-color);
            text-decoration: none;
            margin: 0 4px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            padding: 7px 16px;
            border-radius: 30px;
            transition: all 0.25s ease;
            display: inline-block;
        }

        .top-nav a:hover {
            color: var(--heading-color);
            background-color: var(--sage-light);
        }

        /* Header */
        header {
            padding: 64px 0 44px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            cursor: pointer;
            transition: color 0.3s;
        }

        header h1:hover {
            color: var(--sage);
        }

        header p {
            margin: 14px 0 0;
            font-size: 1.05rem;
            color: var(--sage);
            font-style: italic;
            font-family: 'Fraunces', serif;
            position: relative;
            display: inline-block;
        }

        header p::after {
            content: "";
            display: block;
            width: 46px;
            height: 2px;
            background: var(--primary-color);
            margin: 14px auto 0;
            opacity: 0.6;
        }

        /* Post Cards */
        .post-card,
        .single-post {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            margin-bottom: 36px;
            box-shadow: 0 8px 26px rgba(46, 42, 34, 0.06);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .post-card {
            cursor: pointer;
        }

        .post-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 36px rgba(109, 124, 94, 0.14);
            border-color: var(--sage);
        }

        .single-post {
            cursor: default;
        }

        .post-header {
            padding: 20px 28px;
            display: flex;
            align-items: center;
        }

        .post-header img.avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 14px;
            background-color: var(--sage-light);
            border: 2px solid var(--sage-light);
            box-shadow: 0 2px 6px rgba(46, 42, 34, 0.06);
        }

        .post-header .username {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.2px;
        }

        .post-image {
            width: 100%;
            display: block;
            max-height: 440px;
            object-fit: cover;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .post-content {
            padding: 28px 32px 12px;
        }

        .post-content h1,
        .post-content h2 {
            margin: 0 0 15px;
            font-size: 1.85rem;
            line-height: 1.3;
            font-weight: 600;
        }

        .post-content p {
            margin-bottom: 20px;
            font-size: 1.02rem;
        }

        .post-content a {
            color: var(--primary-hover);
            text-decoration: none;
            border-bottom: 1px solid var(--primary-color);
            transition: all 0.2s;
        }

        .post-content a:hover {
            color: var(--sage);
            border-bottom-color: var(--sage);
        }

        .post-footer {
            padding: 18px 32px;
            color: #948c78;
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            background-color: var(--sage-light);
        }

        /* Single Post Overrides */
        .single-post .post-image {
            max-height: none;
        }

        /* Back Button */
        .back-button {
            display: inline-flex;
            align-items: center;
            margin-bottom: 25px;
            color: var(--heading-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            padding: 9px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            box-shadow: 0 3px 10px rgba(46, 42, 34, 0.04);
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: var(--sage);
            color: #ffffff;
            border-color: var(--sage);
            transform: translateX(-3px);
        }

                // 👇 Change this to point to your local assets folder
                image: './assets/USA craft.png',
                excerpt: 'Turn a walk in the woods into wall art! 🍂 This rustic twig frame is woven with jute and filled with pressed leaves, dried sunflowers, pinecones, acorns, and citrus slices for the coziest autumn vibe. • Use foraged sticks for a totally free frame • Swap in seasonal blooms to refresh it year-round. Perfect for a boho entryway or reading nook. Save for later so you remember to try it this fall! #driedflowercraft #twigframe #foragedhome #cottagecoreDIY #rusticwalldecor',
                content: `
<p>There is something deeply satisfying about turning a simple walk outside into a piece of art for your home. This rustic twig frame wall hanging does exactly that, transforming fallen branches, dried leaves, and foraged extras into a stunning display piece that feels both wild and intentional. It is the kind of project that costs almost nothing yet delivers a look you could not easily buy in a store.</p>

<p>Built from little more than sturdy sticks, jute twine, and a season worth of pressed botanicals, this style of wall art has become a favorite among boho and cottagecore decorators. It brings texture, warmth, and a genuine connection to nature into any room, and no two versions ever look quite the same.</p>

<div style="background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:18px 20px;margin:24px 0;">
  <h3 style="margin-top:0;margin-bottom:12px;font-size:24px;line-height:1.4;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Key Takeaways</h3>
  <ul style="margin:0;padding-left:20px;">
    <li>Twig frame wall hangings are made almost entirely from foraged materials</li>
    <li>A simple jute grid holds pressed flowers, leaves, and dried extras in place</li>
    <li>Pinecones, acorns, and dried citrus slices add texture and seasonal charm</li>
    <li>The project is nearly free and endlessly customizable</li>
    <li>It works beautifully in boho, cottagecore, and rustic farmhouse spaces</li>
  </ul>
</div>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Why Twig Frame Art Is Taking Over Cottagecore Homes</h2>

<p>Modern decor is shifting away from mass produced pieces and toward decor that tells a story. A twig frame wall hanging does just that. Every branch, every dried bloom, and every pinecone was gathered by hand, which gives the finished piece a sense of history and personality that a printed canvas simply cannot match.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">A Connection to the Outdoors</h3>
<p>Hanging foraged botanicals on your wall is a small way of bringing the outside in. It keeps the changing seasons present in your home long after the leaves have fallen or the flowers have faded, and it gives your space a lived in, gathered over time feeling.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Zero Waste, Endless Character</h3>
<p>Because the base materials are things you already find on the ground, this project is about as low waste as decor gets. Broken branches, curled leaves, and less than perfect pinecones are exactly what you want here. Imperfection is the whole point.</p>

<p style="background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;"><strong>Important:</strong> Do not wait for perfect materials. Slightly bent branches, curled leaves, and imperfect pinecones actually add more character to the finished piece than uniform, store bought decor ever could.</p>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Gathering Your Materials</h2>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Sturdy Branches for the Frame</h3>
<p>Look for four relatively straight, dry branches to form the outer rectangle. Thicker pieces work well for the top and bottom, while slightly thinner branches make a good pair of side rails. Moss covered pieces add an extra earthy touch.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Jute Twine for the Grid</h3>
<p>Natural jute twine is the easiest way to create a woven grid across your frame. It is inexpensive, holds knots well, and its rough texture blends seamlessly with the rest of the foraged materials.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Pressed Flowers, Leaves, and Foraged Extras</h3>
<p>Dried oak leaves, daisies, sunflowers, and small chrysanthemum style blooms all press beautifully. Round out the collection with pinecones, acorns, dried orange slices, wheat stalks, and small pieces of bark for depth and variety.</p>

<div style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:12px;padding:16px 18px;margin:26px 0;">
  <h4 style="font-size:20px;line-height:1.4;margin:0 0 10px;color:#334155;font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;">Expert Insight</h4>
  <p style="margin:0;color:#334155;">Mixing textures is what makes this project feel curated rather than random. Pair something soft like a daisy with something rigid like a pinecone, and something flat like a leaf with something round like a dried orange slice.</p>
</div>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">How to Build Your Own Twig Frame</h2>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Step One: Building the Rectangle</h3>
<p>Lay your four branches into a rectangle and secure each corner tightly with jute twine, wrapping several times before knotting. A dab of hot glue underneath the twine can help the corners stay put over time.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Step Two: Weaving the Grid</h3>
<p>Run twine horizontally and vertically across the inside of the frame to create an open grid. This grid is what gives you tiny anchor points to tuck stems and small branches into once you start layering in botanicals.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Step Three: Layering In Your Botanicals</h3>
<p>Starting from the center out, tuck stems of your pressed flowers and leaves behind the grid lines. Add pinecones, acorns, and dried citrus last, nestling them into open pockets so the arrangement feels full but not overcrowded.</p>

<p style="background:#fff7ed;border:1px solid #fed7aa;padding:16px 18px;border-radius:10px;margin:22px 0;color:#9a3412;"><strong>Pro Tip:</strong> Work in odd numbered clusters of three or five when placing similar items like acorns or pinecones. Odd numbered groupings almost always look more natural than even, symmetrical ones.</p>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Styling Ideas for Every Room</h2>

<p>A twig frame wall hanging looks equally at home in an entryway, above a reading chair, or leaning against a mantel. Its neutral, earthy palette means it pairs easily with linen curtains, woven baskets, and other natural textures already in your space.</p>

<p style="background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;"><strong>Important:</strong> Hang your frame somewhere out of direct sunlight. Pressed botanicals fade faster with constant UV exposure, so an entryway wall or a shaded reading nook will keep the colors looking rich for much longer.</p>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Keeping the Look Fresh Through the Seasons</h2>

<p>One of the best parts of this project is how easy it is to refresh. Swap in dried lavender and wildflowers for spring, sunflowers and wheat for summer, or keep the oak leaves and pinecones for a cozy autumn look that lasts well into winter.</p>

<div style="background:#f1f5f9;border-radius:12px;padding:16px 18px;margin:18px 0;">
  <ul style="margin:0;padding-left:20px;">
    <li>Sturdy branches and jute twine form the entire base structure</li>
    <li>Pressed flowers and leaves are tucked directly into the woven grid</li>
    <li>Pinecones, acorns, and dried citrus add texture and seasonal flair</li>
    <li>Odd numbered clusters of accents look more natural than even ones</li>
    <li>Swapping botanicals seasonally keeps the piece feeling brand new</li>
  </ul>
</div>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Conclusion</h2>

<p>A rustic twig frame wall hanging proves that some of the most beautiful decor comes from a walk outside rather than a shopping trip. With a handful of branches, some jute twine, and whatever pressed botanicals you have on hand, you can create a piece that feels personal, seasonal, and completely one of a kind.</p>

<p>Whether it becomes the focal point of your entryway or a quiet detail above a favorite reading chair, this foraged wall art is proof that nature already gives us everything we need to decorate a beautiful home.</p>

<p>This project sits at the sweet spot between craft and decor. It is small enough to finish in an afternoon, yet detailed enough to feel like a genuine keepsake. Whether hung individually or clustered together, these fairy doors bring a storybook charm to shelves, wreaths, and holiday trees alike.</p>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">What Makes a Fairy Door Ornament So Charming</h2>

<p>Part of what makes this craft so appealing is the sense of scale. A door small enough to fit in your palm somehow feels more magical than a full sized one, as if it truly belongs to someone unseen. Add in real moss, dried botanicals, and tiny metal hardware, and the illusion becomes complete.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">A Craft Rooted in Cottagecore</h3>
<p>Fairy door ornaments fit naturally into the cottagecore aesthetic, which celebrates handmade charm, nature, and a slower pace of living. They photograph beautifully and layer effortlessly with dried flowers, wool sweaters, and vintage keys for a styled flat lay or shelf display.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Small Scale, Big Impact</h3>
<p>Because each door is only a few inches wide, you can create an entire set from a small amount of moss, a handful of dried flowers, and a few wooden discs. It is one of the most budget friendly nature crafts you can make.</p>

<p style="background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;"><strong>Important:</strong> Fairy door ornaments are especially forgiving for beginners. Because the moss covers most seams and imperfections, small mistakes in placement or gluing are almost never visible in the finished piece.</p>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Gathering Your Materials</h2>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">A Wooden Door Base</h3>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Sheet Moss and a Round Backing</h3>
<p>Glue your door onto a round wood slice or cardboard disc slightly larger than the door itself, then cover the remaining border with sheet moss to create that classic woodland frame.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Tiny Botanicals and Details</h3>
<p>Mini pinecones, dried wheat, small dried daisies, and a miniature toadstool bring the door to life. A wooden bead threaded onto jute cord finishes the ornament with a simple, natural hanger.</p>

<div style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:12px;padding:16px 18px;margin:26px 0;">
  <h4 style="font-size:20px;line-height:1.4;margin:0 0 10px;color:#334155;font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;">Why This Matters</h4>
  <p style="margin:0;color:#334155;">Using a mix of dried textures, moss, wheat, and tiny florals keeps each door from looking flat. Variety in height and texture is what sells the miniature, lived in feeling of a fairy home.</p>
</div>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Step by Step Assembly</h2>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Attach the Door to Its Base</h3>
<p>Center your wooden door on the round base and secure it with a strong craft glue. Let it fully set before moving on so the door does not shift while you are adding moss.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Frame It With Moss</h3>
<p>Tear sheet moss into small pieces and glue them around the exposed border of the base, slightly overlapping the edge of the door for a soft, natural transition.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Add the Finishing Details</h3>
<p>Tuck in your dried florals, wheat stalks, and mini pinecones along the bottom and one side of the door, then nestle a tiny toadstool near the base as a playful final touch.</p>

<p style="background:#fff7ed;border:1px solid #fed7aa;padding:16px 18px;border-radius:10px;margin:22px 0;color:#9a3412;"><strong>Pro Tip:</strong> Attach your hanging loop to the back of the base before adding the moss and florals. It is much easier to hide the knot underneath the moss than to work around finished details later.</p>

<p>Unlike printed botanical art, a pressed flower tile holds an actual piece of a real plant. That authenticity is exactly why this style of wall hanging resonates so strongly with people who love slow, handmade decor. Every tile is a tiny time capsule of a specific bloom, a specific season, or a specific memory.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">A Gallery Wall in Miniature</h3>
<p>Because each tile is small, you can display dozens of different flowers without overwhelming a space. The variety of shapes, from a delicate fern frond to a bold dandelion, gives the whole arrangement a naturally curated, gallery like feel.</p>

<p style="background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;"><strong>Important:</strong> Choose flowers with thin, flat petals for the best results. Daisies, ferns, forget me nots, and pansies press cleanly, while thick or fleshy blooms tend to hold moisture and can mold before they finish drying.</p>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Pressing and Preparing Your Flowers</h2>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Choosing What to Press</h3>
<p>Garden clippings, wildflowers, and even grocery store bouquets all work well. Ferns, small daisies, dandelions, and tiny sprigs of forget me nots are especially reliable choices for beginners.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">The Pressing Process</h3>
<p>Arrange your flowers between sheets of parchment paper inside a heavy book, or use a flower press if you have one. Leave them undisturbed for one to two weeks until fully dry and flat.</p>

<div style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:12px;padding:16px 18px;margin:26px 0;">
  <h4 style="font-size:20px;line-height:1.4;margin:0 0 10px;color:#334155;font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;">Quick Note</h4>
  <p style="margin:0;color:#334155;">Check on your pressed flowers around the one week mark and swap in fresh paper if it feels damp. This small step helps preserve color and prevents the flowers from turning brown at the edges.</p>
</div>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Building the Wall Hanging</h2>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Mounting Flowers on Wood Tiles</h3>
<p>Cut small wood squares or use pre cut craft tiles, then adhere each pressed flower with a thin layer of clear craft glue or resin. A light coat of sealant on top helps protect the petals and keeps colors from fading.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Adding a Sentimental Tile</h3>
<p>Set aside one tile for a handwritten phrase, like a favorite quote or a sweet message, alongside a single pressed bloom. This tile naturally becomes the emotional centerpiece of the whole display.</p>

<p style="background:#fff7ed;border:1px solid #fed7aa;padding:16px 18px;border-radius:10px;margin:22px 0;color:#9a3412;"><strong>Pro Tip:</strong> Use a fine tip paint pen for your handwritten tile instead of a regular marker. It glides smoothly over sealed wood and gives you much crisper, more controlled lettering.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Stringing the Tiles Together</h3>
<p>Attach a small twine loop to the back of each tile, then arrange them across a piece of woven fabric, a macrame hanger, or a simple dowel so the tiles appear to float in a loose, staggered pattern.</p>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Why Pressed Flowers Belong in a Window, Not Just a Book</h2>

<p>Most pressed flower projects live flat on paper or tucked inside a journal, where their beauty is easy to forget. Sealing pressed blooms between two panes of glass instead puts them directly in the path of natural light, which is exactly where their colors and textures shine the most.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">A Living Piece of Light</h3>
<p>Because the flowers are backlit rather than viewed under regular lighting, even a simple daisy or fern takes on a glowing, almost translucent quality. This effect is very hard to recreate with any other display method.</p>

<p style="background:#f8fafc;border-left:4px solid #2563eb;padding:16px 18px;border-radius:10px;margin:22px 0;color:#1e293b;"><strong>Important:</strong> Flowers with thinner petals, like daisies, pansies, and forget me nots, let more light through and glow far more dramatically than thick or layered blooms once backlit.</p>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">What You Will Need</h2>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Two Round Pieces of Glass</h3>
<p>Precut circular glass, available at most craft and stained glass suppliers, forms the front and back of the suncatcher and keeps your pressed flowers protected and perfectly flat.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Pressed Flowers and Foliage</h3>
<p>A mix of one larger focal flower, like a sunflower or daisy, along with smaller wildflowers, petals, and bits of greenery creates the fullest, most balanced arrangement.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Copper Foil, Solder, and Chain</h3>
<p>Copper foil tape wraps the glass edges, solder joins the seam into a smooth metal border, and a length of chain attached through two small loops lets the finished piece hang freely.</p>

<div style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:12px;padding:16px 18px;margin:26px 0;">
  <h4 style="font-size:20px;line-height:1.4;margin:0 0 10px;color:#334155;font-weight:700;background:#f8fafc;padding:10px 14px;border-radius:8px;">Expert Insight</h4>
  <p style="margin:0;color:#334155;">Arrange your flowers off center rather than perfectly in the middle. A slightly asymmetrical layout, with blooms clustered toward one side, tends to look more natural and more like a real gathered bouquet.</p>
</div>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Putting the Suncatcher Together</h2>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Arranging Your Botanicals</h3>
<p>Lay your pressed flowers directly onto one glass disc, starting with your focal bloom and building outward with smaller flowers and greenery until the layout feels full but still balanced.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Sealing the Glass</h3>
<p>Carefully place the second glass disc on top, sandwiching the flowers between the two layers without shifting their placement, then run copper foil tape around the entire edge.</p>

<h3 style="font-size:24px;line-height:1.4;margin:28px 0 14px;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Soldering the Frame</h3>
<p>Run a bead of solder along the copper foil to create a smooth, durable border, adding two small loops at the top where your chain will attach.</p>

<p style="background:#fff7ed;border:1px solid #fed7aa;padding:16px 18px;border-radius:10px;margin:22px 0;color:#9a3412;"><strong>Pro Tip:</strong> If soldering feels intimidating, a strong adhesive lined metal tape can create a similar framed look for a beginner friendly alternative that still holds the glass securely in place.</p>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Finding the Perfect Spot to Hang It</h2>

<p>A south or west facing window generally gives the longest stretch of direct light, which means more hours of that glowing, sunlit effect. Hanging it at eye level near a kitchen sink or reading nook also turns it into a small daily moment of beauty.</p>

<div style="background:#f8fafc;border:1px solid #dbe4ee;border-radius:12px;padding:16px 18px;margin:28px 0;">
  <h3 style="margin-top:0;margin-bottom:10px;font-size:24px;line-height:1.4;color:#1e293b;font-weight:700;padding-left:12px;border-left:4px solid #cbd5e1;">Quick Points</h3>
  <ul style="margin:0;padding-left:20px;">
    <li>Use thin petaled flowers for the most dramatic backlit glow</li>
    <li>Balance one focal bloom with smaller wildflowers and greenery</li>
    <li>Copper foil and solder create a classic stained glass edge</li>
    <li>Hang in a sunny, south or west facing window for best results</li>
  </ul>
</div>

<h2 style="font-size:30px;line-height:1.3;margin:36px 0 18px;color:#0f172a;border-bottom:2px solid #e2e8f0;padding-bottom:10px;font-weight:700;">Conclusion</h2>

<p>A pressed flower suncatcher takes the fleeting beauty of a bouquet and gives it a second life in glass and light. It is a project that rewards patience, from pressing the flowers to soldering the frame, but the payoff is a piece that brings a little bit of sunshine into your home every single day.</p>

<p>Try it with blooms from a garden you love, a bouquet from a special occasion, or simply whatever wildflowers you can find on your next walk. Either way, you will end up with something worth hanging in your favorite window for years to come.</p>

            `;
            window.scrollTo(0, 0); // Scroll to top
        }

        // Function to render a single post
        function renderPost(postId) {
            const post = posts.find(p => p.id === postId);

            if (!post) {
                app.innerHTML = `<p style="color: var(--text-color);">Post not found.</p><a class="back-button" onclick="navigate('home')">&larr; Back to Dashboard</a>`;
                return;
            }

            app.innerHTML = `

                    <div class="post-header">
                        <img class="avatar" src="${avatarUrl}" alt="Avatar">
                        <span class="username">${blogUsername}</span>

            `;

        // Simple router/navigator
        function navigate(view, id = null) {
            if (view === 'home') {
                window.location.hash = '';
                renderHome();
            } else if (view === 'post') {
                window.location.hash = id;
                renderPost(id);
            } else if (view === 'page') {
                window.location.hash = id;
                renderPage(id);
            }
        }

        // Listen for browser back/forward buttons
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                // Check if the hash matches a static page, otherwise assume it's a post
                if (pages[hash]) {
                    renderPage(hash);
                } else {
                    renderPost(hash);
                }
            } else {
                renderHome();
            }
        });

        // Initial Load
        const initialHash = window.location.hash.replace('#', '');
        if (initialHash) {
            if (pages[initialHash]) {
                renderPage(initialHash);
            } else {
                renderPost(initialHash);
            }
        } else {
            renderHome();
